<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">AgriFabric relationship graph</title>
  <desc id="desc">Relationship graph showing Company/FPO, Project, Field agent, Farmer, Parcel, Crop cycle, Field event, Media, Advisory, Delivery, Sync event, and Audit trail nodes connected as an agriculture evidence graph, with roadmap analytics separated from implemented traceability.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#061827"/>
      <stop offset="55%" stop-color="#0b2638"/>
      <stop offset="100%" stop-color="#123026"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-roadmap" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f59e0b"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #cbd5e1; font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #f8fafc; font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #cbd5e1; font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge-label { fill: #dbeafe; font: 600 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .badge { font: 700 10px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; text-transform: uppercase; text-anchor: middle; }
      .node { filter: url(#shadow); stroke-width: 1.4; }
      .org { fill: #0f2f4a; stroke: #38bdf8; }
      .field { fill: #103b2d; stroke: #22c55e; }
      .comm { fill: #2e244b; stroke: #a78bfa; }
      .audit { fill: #263244; stroke: #94a3b8; }
      .roadmap { fill: rgba(120, 53, 15, .32); stroke: #f59e0b; stroke-dasharray: 8 6; }
      .edge-green { fill: none; stroke: #22c55e; stroke-width: 3; marker-end: url(#arrow-teal); opacity: .9; }
      .edge-blue { fill: none; stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrow-blue); opacity: .88; }
      .edge-purple { fill: none; stroke: #a78bfa; stroke-width: 3; marker-end: url(#arrow-blue); opacity: .88; }
      .edge-slate { fill: none; stroke: #94a3b8; stroke-width: 2.6; marker-end: url(#arrow-slate); opacity: .78; }
      .edge-roadmap { fill: none; stroke: #f59e0b; stroke-width: 2.8; stroke-dasharray: 8 7; marker-end: url(#arrow-roadmap); opacity: .86; }
      .chip-fill { fill: #0f172a; stroke: rgba(203,213,225,.32); }
      .chip-text { fill: #e2e8f0; font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="840" rx="0" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="210" fill="#22c55e" opacity="0.07"/>
  <circle cx="150" cy="690" r="240" fill="#38bdf8" opacity="0.08"/>

  <text x="72" y="64" class="title">AgriFabric relationship graph</text>
  <text x="72" y="96" class="subtitle">Traceability today. Advanced scoring and matching are roadmap modules.</text>

  <g transform="translate(72 116)">
    <rect class="chip-fill" x="0" y="0" width="118" height="28" rx="14"/>
    <text class="chip-text" x="59" y="19">Verified MVP</text>
    <rect class="chip-fill" x="132" y="0" width="108" height="28" rx="14"/>
    <text class="chip-text" x="186" y="19">Foundation</text>
    <rect class="chip-fill" x="254" y="0" width="96" height="28" rx="14"/>
    <text class="chip-text" x="302" y="19">Roadmap</text>
  </g>

  <!-- Edges: project and identity -->
  <path class="edge-blue" d="M230 180 C260 190 295 210 330 230"/>
  <text x="278" y="196" class="edge-label">runs</text>
  <path class="edge-blue" d="M350 270 C300 285 250 318 214 348"/>
  <text x="282" y="310" class="edge-label">assigns</text>
  <path class="edge-blue" d="M420 270 C450 292 485 322 505 348"/>
  <text x="466" y="310" class="edge-label">enrolls</text>
  <path class="edge-blue" d="M236 380 C315 380 410 380 490 380"/>
  <text x="362" y="368" class="edge-label">assists</text>

  <!-- Edges: parcel and crop evidence -->
  <path class="edge-green" d="M555 412 C555 432 555 452 555 472"/>
  <text x="604" y="448" class="edge-label">operates</text>
  <path class="edge-green" d="M518 510 C472 527 425 548 385 572"/>
  <text x="452" y="543" class="edge-label">locates</text>
  <path class="edge-green" d="M596 510 C628 528 662 548 690 572"/>
  <text x="646" y="545" class="edge-label">grows</text>
  <path class="edge-green" d="M745 626 C815 598 858 520 875 442"/>
  <text x="842" y="548" class="edge-label">records</text>

  <!-- Edges: field event and advisory -->
  <path class="edge-green" d="M613 368 C681 330 762 298 845 282"/>
  <text x="724" y="314" class="edge-label">reports</text>
  <path class="edge-green" d="M925 282 C948 282 970 282 990 282"/>
  <text x="960" y="270" class="edge-label">attaches</text>
  <path class="edge-purple" d="M1048 314 C1048 332 1048 350 1048 366"/>
  <text x="1094" y="342" class="edge-label">triggers</text>
  <path class="edge-purple" d="M1024 414 C984 448 930 477 885 502"/>
  <text x="956" y="456" class="edge-label">targets</text>
  <path class="edge-purple" d="M1016 416 C1012 445 1012 474 1018 502"/>
  <text x="1074" y="470" class="edge-label">tracks</text>

  <!-- Edges: audit and roadmap -->
  <path class="edge-slate" d="M890 412 C895 500 850 590 815 660"/>
  <text x="868" y="560" class="edge-label">syncs</text>
  <path class="edge-slate" d="M875 684 C900 684 930 684 958 684"/>
  <text x="916" y="670" class="edge-label">records</text>
  <path class="edge-roadmap" d="M1030 720 C880 764 650 770 508 730"/>
  <path class="edge-roadmap" d="M555 542 C520 610 455 660 420 696"/>
  <path class="edge-roadmap" d="M1048 576 C880 704 650 728 508 730"/>

  <!-- Nodes -->
  <g>
    <rect class="node org" x="95" y="150" width="150" height="60" rx="18"/>
    <text class="label" x="170" y="174">Company / FPO</text>
    <text class="small" x="170" y="195">runs programs</text>
  </g>

  <g>
    <rect class="node org" x="285" y="220" width="130" height="58" rx="18"/>
    <text class="label" x="350" y="245">Project</text>
    <text class="small" x="350" y="265">scope + cohort</text>
  </g>

  <g>
    <rect class="node org" x="104" y="348" width="132" height="62" rx="18"/>
    <text class="label" x="170" y="373">Field agent</text>
    <text class="small" x="170" y="394">assisted work</text>
  </g>

  <g>
    <rect class="node org" x="490" y="348" width="130" height="64" rx="18"/>
    <text class="label" x="555" y="374">Farmer</text>
    <text class="small" x="555" y="395">identity persists</text>
  </g>

  <g>
    <rect class="node field" x="490" y="472" width="130" height="70" rx="18"/>
    <text class="label" x="555" y="501">Parcel</text>
    <text class="small" x="555" y="522">land evidence</text>
  </g>

  <g>
    <rect class="node field" x="278" y="572" width="144" height="66" rx="18"/>
    <text class="label" x="350" y="598">GPS / DigiPin</text>
    <text class="small" x="350" y="620">coordinate precision</text>
  </g>

  <g>
    <rect class="node field" x="626" y="572" width="128" height="66" rx="18"/>
    <text class="label" x="690" y="598">Crop cycle</text>
    <text class="small" x="690" y="620">season record</text>
  </g>

  <g>
    <rect class="node field" x="796" y="366" width="150" height="76" rx="18"/>
    <text class="label" x="871" y="393">Stage / activity</text>
    <text class="small" x="871" y="414">work + cost trail</text>
  </g>

  <g>
    <rect class="node field" x="805" y="250" width="132" height="64" rx="18"/>
    <text class="label" x="871" y="276">Field event</text>
    <text class="small" x="871" y="297">ground report</text>
  </g>

  <g>
    <rect class="node field" x="990" y="250" width="116" height="64" rx="18"/>
    <text class="label" x="1048" y="276">Media</text>
    <text class="small" x="1048" y="297">photo evidence</text>
  </g>

  <g>
    <rect class="node comm" x="968" y="366" width="160" height="70" rx="18"/>
    <text class="label" x="1048" y="392">Advisory</text>
    <text class="small" x="1048" y="414">targeted broadcast</text>
  </g>

  <g>
    <rect class="node comm" x="792" y="502" width="136" height="66" rx="18"/>
    <text class="label" x="860" y="528">Audience rule</text>
    <text class="small" x="860" y="550">cohort selection</text>
  </g>

  <g>
    <rect class="node comm" x="956" y="502" width="184" height="74" rx="18"/>
    <text class="label" x="1048" y="530">Delivery/read/ack</text>
    <text class="small" x="1048" y="552">lifecycle analytics</text>
  </g>

  <g>
    <rect class="node audit" x="725" y="654" width="150" height="62" rx="18"/>
    <text class="label" x="800" y="680">Sync event</text>
    <text class="small" x="800" y="700">offline replay</text>
  </g>

  <g>
    <rect class="node audit" x="958" y="654" width="154" height="62" rx="18"/>
    <text class="label" x="1035" y="680">Audit trail</text>
    <text class="small" x="1035" y="700">conflict history</text>
  </g>

  <g>
    <rect class="node roadmap" x="236" y="692" width="272" height="78" rx="22"/>
    <text class="label" x="372" y="720">Roadmap analytics</text>
    <text class="small" x="372" y="742">agent performance • risk review</text>
    <rect x="315" y="750" width="114" height="18" rx="9" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text class="badge" x="372" y="763" fill="#fbbf24">Roadmap</text>
  </g>

  <!-- Highlight callouts -->
  <g transform="translate(72 780)">
    <rect x="0" y="0" width="250" height="42" rx="16" fill="rgba(15, 23, 42, .72)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="125" y="18" class="chip-text">Project graph</text>
    <text x="125" y="34" class="small">FPO → project → farmer cohort</text>
  </g>
  <g transform="translate(450 780)">
    <rect x="0" y="0" width="260" height="42" rx="16" fill="rgba(15, 23, 42, .72)" stroke="#22c55e" stroke-width="1.2"/>
    <text x="130" y="18" class="chip-text">Crop evidence graph</text>
    <text x="130" y="34" class="small">parcel → cycle → activity → audit</text>
  </g>
  <g transform="translate(820 780)">
    <rect x="0" y="0" width="290" height="42" rx="16" fill="rgba(15, 23, 42, .72)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="145" y="18" class="chip-text">Advisory action graph</text>
    <text x="145" y="34" class="small">event → media → advisory → read/ack</text>
  </g>

</svg>
