<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430">
  <defs>
    <style>
      .bg{fill:#061826}
      .orb{fill:#0f3a42;opacity:.5}
      .title{font:700 42px Arial,Helvetica,sans-serif;fill:#fff}
      .subtitle{font:400 20px Arial,Helvetica,sans-serif;fill:#d9ecff}
      .nodeTitle{font:700 21px Arial,Helvetica,sans-serif;fill:#fff}
      .nodeSub{font:400 14px Arial,Helvetica,sans-serif;fill:#e7f3ff}
      .label{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#9dc4e8}
      .blue{fill:#103654;stroke:#32bfff;stroke-width:2}
      .green{fill:#0e432f;stroke:#20d66d;stroke-width:2}
      .purple{fill:#302353;stroke:#a78bfa;stroke-width:2}
      .gray{fill:#263449;stroke:#9aa8bd;stroke-width:2}
      .amber{fill:#3a2807;stroke:#f59e0b;stroke-width:2;stroke-dasharray:10 8}
      .lineBlue{stroke:#32bfff;stroke-width:4;fill:none}
      .lineGreen{stroke:#20d66d;stroke-width:4;fill:none}
      .lineGray{stroke:#9aa8bd;stroke-width:4;fill:none}
      .linePurple{stroke:#a78bfa;stroke-width:4;fill:none}
      .lineAmber{stroke:#f59e0b;stroke-width:3;fill:none;stroke-dasharray:9 8}
    </style>
  </defs>

  <rect class="bg" width="1600" height="430"/>
  <circle class="orb" cx="1330" cy="30" r="270"/>

  <text x="52" y="64" class="title">AgriFabric</text>
  <text x="52" y="98" class="subtitle">A field evidence fabric for capture, coordination, sync, advisories, governance, and future risk intelligence.</text>

  <text x="75" y="150" class="label">VERIFIED FOUNDATION</text>

  <rect x="75" y="180" width="205" height="92" rx="24" class="blue"/>
  <text x="177" y="216" text-anchor="middle" class="nodeTitle">Android</text>
  <text x="177" y="244" text-anchor="middle" class="nodeSub">field capture</text>

  <path d="M280 226 H355" class="lineBlue"/>
  <rect x="355" y="180" width="205" height="92" rx="24" class="green"/>
  <text x="457" y="216" text-anchor="middle" class="nodeTitle">Sync</text>
  <text x="457" y="244" text-anchor="middle" class="nodeSub">offline replay</text>

  <path d="M560 226 H635" class="lineGreen"/>
  <rect x="635" y="180" width="230" height="92" rx="24" class="gray"/>
  <text x="750" y="216" text-anchor="middle" class="nodeTitle">Evidence fabric</text>
  <text x="750" y="244" text-anchor="middle" class="nodeSub">contracts + audit graph</text>

  <path d="M865 226 H940" class="lineGray"/>
  <rect x="940" y="180" width="230" height="92" rx="24" class="purple"/>
  <text x="1055" y="216" text-anchor="middle" class="nodeTitle">Admin operations</text>
  <text x="1055" y="244" text-anchor="middle" class="nodeSub">projects + advisories</text>

  <path d="M1170 226 H1245" class="linePurple"/>
  <rect x="1245" y="180" width="250" height="92" rx="24" class="amber"/>
  <text x="1370" y="216" text-anchor="middle" class="nodeTitle">Roadmap intelligence</text>
  <text x="1370" y="244" text-anchor="middle" class="nodeSub">bounded review modules</text>

  <rect x="370" y="325" width="860" height="46" rx="22" class="gray"/>
  <text x="800" y="354" text-anchor="middle" class="nodeSub">Implemented MVP today. Risk scoring, NDVI, live providers, and claim decisions remain roadmap/approval-gated.</text>
</svg>
