<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .bg{fill:#061826}
      .orb1{fill:#0f3a42;opacity:.5}
      .orb2{fill:#0d3b5a;opacity:.36}
      .title{font:700 42px Arial,Helvetica,sans-serif;fill:#fff}
      .subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#d9ecff}
      .card{fill:#071d2d;stroke:#173044;stroke-width:1.3}
      .nodeTitle{font:700 25px Arial,Helvetica,sans-serif;fill:#fff}
      .nodeSub{font:400 15px Arial,Helvetica,sans-serif;fill:#e7f3ff}
      .label{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#9dc4e8}
      .blue{fill:#103654;stroke:#32bfff;stroke-width:2}
      .green{fill:#0e432f;stroke:#20d66d;stroke-width:2}
      .purple{fill:#302353;stroke:#a78bfa;stroke-width:2}
      .gray{fill:#263449;stroke:#9aa8bd;stroke-width:2}
      .amber{fill:#3a2807;stroke:#f59e0b;stroke-width:2;stroke-dasharray:10 8}
      .lineBlue{stroke:#32bfff;stroke-width:4;fill:none}
      .lineGreen{stroke:#20d66d;stroke-width:4;fill:none}
      .linePurple{stroke:#a78bfa;stroke-width:4;fill:none}
      .lineGray{stroke:#9aa8bd;stroke-width:4;fill:none}
      .lineAmber{stroke:#f59e0b;stroke-width:4;fill:none;stroke-dasharray:8 7}
      .white{fill:#fff}
    </style>
  </defs>

  <rect class="bg" width="1500" height="760"/>
  <circle class="orb1" cx="1260" cy="90" r="285"/>
  <circle class="orb2" cx="130" cy="705" r="260"/>

  <text x="48" y="58" class="title">AgriFabric product pillars</text>
  <text x="48" y="94" class="subtitle">Six reusable pillars for landing pages, demo overlays, and product explainers.</text>

  <!-- Capture -->
  <rect x="60" y="150" width="420" height="220" rx="28" class="card"/>
  <rect x="95" y="190" width="96" height="96" rx="24" class="blue"/>
  <path d="M125 216 H162 M125 240 H165 M125 264 H152" class="lineBlue"/>
  <circle cx="170" cy="267" r="9" class="white"/>
  <text x="225" y="214" class="label">FIELD APP</text>
  <text x="225" y="250" class="nodeTitle">Capture</text>
  <text x="225" y="282" class="nodeSub">farmer • parcel • crop • media</text>
  <text x="225" y="308" class="nodeSub">field events and activity evidence</text>

  <!-- Coordinate -->
  <rect x="540" y="150" width="420" height="220" rx="28" class="card"/>
  <rect x="575" y="190" width="96" height="96" rx="24" class="green"/>
  <circle cx="623" cy="218" r="15" fill="#20d66d"/>
  <circle cx="603" cy="260" r="12" fill="#20d66d"/>
  <circle cx="646" cy="260" r="12" fill="#20d66d"/>
  <path d="M623 233 V248 M613 260 H636" class="lineGreen"/>
  <text x="705" y="214" class="label">PROJECT OPS</text>
  <text x="705" y="250" class="nodeTitle">Coordinate</text>
  <text x="705" y="282" class="nodeSub">FPO/company projects, cohorts,</text>
  <text x="705" y="308" class="nodeSub">field-agent work and admin trace</text>

  <!-- Sync -->
  <rect x="1020" y="150" width="420" height="220" rx="28" class="card"/>
  <rect x="1055" y="190" width="96" height="96" rx="24" class="gray"/>
  <path d="M1086 222 C1105 203 1135 213 1136 239" class="lineGray"/>
  <path d="M1136 239 L1120 232 M1136 239 L1130 220" class="lineGray"/>
  <path d="M1120 262 C1100 281 1071 270 1070 244" class="lineGray"/>
  <path d="M1070 244 L1086 252 M1070 244 L1077 263" class="lineGray"/>
  <text x="1185" y="214" class="label">OFFLINE-FIRST</text>
  <text x="1185" y="250" class="nodeTitle">Sync</text>
  <text x="1185" y="282" class="nodeSub">queue durability, replay,</text>
  <text x="1185" y="308" class="nodeSub">idempotency and conflicts</text>

  <!-- Advise -->
  <rect x="60" y="430" width="420" height="220" rx="28" class="card"/>
  <rect x="95" y="470" width="96" height="96" rx="24" class="purple"/>
  <path d="M120 505 H162 C170 505 176 511 176 519 V534 C176 542 170 548 162 548 H145 L126 562 V548 H120 C112 548 106 542 106 534 V519 C106 511 112 505 120 505Z" fill="none" stroke="#a78bfa" stroke-width="4"/>
  <circle cx="164" cy="498" r="8" fill="#a78bfa"/>
  <text x="225" y="494" class="label">ADVISORIES</text>
  <text x="225" y="530" class="nodeTitle">Advise</text>
  <text x="225" y="562" class="nodeSub">broadcasts, media, targeting,</text>
  <text x="225" y="588" class="nodeSub">language fallback and read/ack</text>

  <!-- Govern -->
  <rect x="540" y="430" width="420" height="220" rx="28" class="card"/>
  <rect x="575" y="470" width="96" height="96" rx="24" class="gray"/>
  <path d="M604 500 H646 M604 524 H646 M604 548 H632" class="lineGray"/>
  <path d="M596 492 L588 500 L596 508 M596 516 L588 524 L596 532 M596 540 L588 548 L596 556" class="lineGray"/>
  <text x="705" y="494" class="label">BACKEND-OWNED</text>
  <text x="705" y="530" class="nodeTitle">Govern</text>
  <text x="705" y="562" class="nodeSub">contracts, labels, options,</text>
  <text x="705" y="588" class="nodeSub">localization and audit</text>

  <!-- Extend -->
  <rect x="1020" y="430" width="420" height="220" rx="28" class="card"/>
  <rect x="1055" y="470" width="96" height="96" rx="24" class="amber"/>
  <path d="M1080 540 C1100 505 1120 505 1140 540" class="lineAmber"/>
  <path d="M1082 520 H1138 M1092 502 H1128" class="lineAmber"/>
  <circle cx="1110" cy="540" r="8" fill="#f59e0b"/>
  <text x="1185" y="494" class="label">ROADMAP FOUNDATION</text>
  <text x="1185" y="530" class="nodeTitle">Extend</text>
  <text x="1185" y="562" class="nodeSub">insurance, subsidy, credit,</text>
  <text x="1185" y="588" class="nodeSub">weather, soil and satellite</text>
</svg>
